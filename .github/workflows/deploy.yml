name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Verify prerendered pages exist
        run: |
          # Outside Lovable the static files can land in dist/public or .output/public.
          if [ ! -f dist/client/index.html ]; then
            for d in dist/public .output/public; do
              if [ -f "$d/index.html" ]; then rm -rf dist/client; mkdir -p dist; cp -r "$d" dist/client; break; fi
            done
          fi
          test -f dist/client/index.html || {
            echo "::error::dist/client/index.html was not generated"
            ls -R dist || true
            exit 1
          }
      - name: Create 404 page
        run: cp dist/client/index.html dist/client/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client
      - id: deployment
        uses: actions/deploy-pages@v4
