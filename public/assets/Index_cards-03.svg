  <text class="cls-2" transform="translate(40.47 44.35)"><tspan x="0" y="0">THE BRIEF BURDEN</tspan></text>
  <text class="cls-4" transform="translate(40.79 73.84)"><tspan x="0" y="0">Name an idea for a project (one </tspan><tspan x="-3.25" y="7.2">thing you could fully own, start to </tspan><tspan x="-7.57" y="14.4">finish, no clients), challenge yourself </tspan><tspan x="-2.08" y="21.6">to write the brief. This could be a </tspan><tspan x="1.12" y="28.8">few bullet points, or a detailed </tspan><tspan x="-5.53" y="36">document. Do you feel more or less </tspan><tspan x="16.44" y="43.2">likely to work on it?</tspan></text>
